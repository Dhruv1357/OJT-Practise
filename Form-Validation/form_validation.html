<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        input:required {
            border: 1px solid red;
        }

        input:valid {
            border: 1px solid green;
        }

        input:valid~span {
            display: none;
        }
        .input:checked~button{
            color: green;
        }
    </style>
</head>

<body>
    <dl class="ms-4 mt-4">
        <dt class="mt-3">
            Username
        </dt>
        <dd>
            <input type="text" required>
        </dd>
        <span style="margin-top: 10px;">Username is Required</span>
        <dt class="mt-3">
            Password
        </dt>
        <dd>
            <input type="text" name="" id="" required>
        </dd>
        <span style="margin-top: 10px;">Password is Required</span>
        <dt class="mt-3">
            Age
        </dt>
        <dd>
            <input type="number">
        </dd>
        <span style="margin-top: 10px;">Age is required</span>
        <dt class="mt-3">Mobile</dt>
        <dd>
            <input type="text" required pattern="\+91\d{10}"> <br>
            <span>Mobile Number is required</span>
        </dd>
    </dl>

    <main class="ms-5 mt-5">
        <h3>Text Area</h3>
        <div>
            <textarea type="text" class="w-25 h-25"> Our Terms and Services
            </textarea>
        </div>
        <div>
            <input type="checkbox" name="" id=""> I accept
        </div>
        <button class="btn" style="background-color: blue; color: white; margin-top:10px ;">Submit</button>
    </main>
</body>

</html>

<!-- 
For Characters - Full stops (.) and spaces will be counted as characters.
For Words - These are counted using spaces, so if we give 3 spaces, 3 words will be counted even if we do not write any word.
For Sentences - Full stops (.) or Question mark(?) or Exclamation mark(!) are used to count number of sentences.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Live Charater & Word Analys</h2>
    <textarea name="" id="" >Hello Students. How are you?</textarea> <br>
    <button onclick="result()" style="border: none; border-radius: 5px; background-color: blue; color: white; padding: 5px;">Analyze</button> <br>
    <div>
        Characters: <span class="char"></span>
    </div>
    <div>
        Words: <span class="words"></span>
    </div>
    <div>
        Sentences: <span class="Sent"></span>
    </div>



    <script src="./Char_count.js"></script>
</body>
</html>

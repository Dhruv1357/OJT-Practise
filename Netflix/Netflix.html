<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>
    <div class="logo">
        <div class="wow">
            <span class="name">
                <img src="./580b57fcd9996e24bc43c529.png" alt="Netflix Logo" width="180px" height="100px"
                    style="margin-top: 15px;" >
            </span>
            <span class="language">
                English <span class="bi bi-caret-down-fill" style="font-size: 16px;"></span>
            </span>
            <span class="Sign"><button style="background-color: transparent; color: white; border: none;" type="button">Sign In</button></span>
        </div>

        <span class="content">
            <b>
                <h2>
                    Unlimited movies,TV<br>
                    shows and more
            </b></span></h2>
        <div class="watch">
            <h4> Starts at ₹149. Cancel at any time.</h4>

        </div>
        <div class="enter">
            <span class="ech5">Ready to watch? Enter your email to create or restart your membership.</span>
        </div>

        <div class="input">
            <span class="email">
            <input type="email" style="border: 1px solid white; background-color: transparent; height: 50px; width: 400px; color: white; font-size: 20px; padding-left: 20px;" placeholder="Enter Email"></input>
            </span>
            <span class="Start">
                <button type="button" style="border: none; background-color: transparent; color: white; font-size: 20px;">Get Started <span class="bi bi-arrow-right" style="font-size: 35px;"></span></button>
            </span>
        </div>
    </div>



</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .black
        {
            background-color: black;
        }
    </style>
</head>
<body>
    <button class="glow" style="width: 150px; height: 150px; font-size: 100px; background-color: transparent; border: none; margin: 100px;">❤️</button>

    <script>
        let change = document.querySelector(".glow");

        change.addEventListener('click',function(e){
        if(change.textContent == "❤️")
        {
            document.body.classList.add("black");
            change.textContent = "✨";
        }
        else if(change.textContent == "✨")
        {

            document.body.classList.remove("black");
            change.textContent = "❤️";
        }

        })
    {
        
    }
    </script>
</body>
</html>
